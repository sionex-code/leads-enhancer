name: Deploy to VPS
on:
  push: { branches: [master] }
  workflow_dispatch: {}
concurrency: { group: deploy-leadsfunda, cancel-in-progress: false }
env:
  VPS_HOST: 144.91.104.65
  VPS_USER: adminsafe
  APP_DIR: /home/adminsafe/leadsfunda
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload
        run: |
          tar czf /tmp/d.tgz --exclude=.git --exclude=.github .
          scp -i ~/.ssh/id_ed25519 /tmp/d.tgz "$VPS_USER@$VPS_HOST:/tmp/leadsfunda.tgz"
      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "
            set -e; mkdir -p $APP_DIR; cd $APP_DIR
            tar xzf /tmp/leadsfunda.tgz && rm /tmp/leadsfunda.tgz
            npm install --no-audit --no-fund
            npm run build
            pm2 restart leadsfunda-ui --update-env || pm2 start npm --name leadsfunda-ui -- run start:web
            pm2 save"
      - name: Health check
        run: ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" 'sleep 5; c=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/); echo "HTTP $c"; [ "$c" = 200 ]||[ "$c" = 401 ]||[ "$c" = 307 ]||[ "$c" = 302 ]'
